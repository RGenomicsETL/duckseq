<title id="title">8-bit matrices · 1 SQL threads</title><desc id="desc">SQL and TinyCC retain SQL lists; LDZip returns an R matrix. These representations differ. Red crosses mark failed resource qualification; failed timings are not shown. Three fresh processes, at least five measured seconds each; whiskers are ranges of process-average latencies.</desc>
