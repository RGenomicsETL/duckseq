<title id="title">Junction CLI latency</title><desc id="desc">Synthetic 120-base reference, three batches per point; every batch has at least five measured seconds. Latency points are medians of batch means; whiskers are ranges. Counts exactly match Gravlax. Not a public-transcriptome timing verdict.</desc>
