<title id="title">8-bit build · nested chr20 regions</title><desc id="desc">Historical build receipts: default DuckDB threads and differing output representations. Three-process median latency/range and maximum RSS. LDZip compression excludes SQLite-index construction. The legacy harness did not enforce every declared resource budget; these are scoped measurements, not full STYLE qualification.</desc>
