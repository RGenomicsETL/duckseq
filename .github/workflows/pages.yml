name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/render-site.sh'
      - 'scripts/check-site.mjs'
      - 'demos/peakwhere/**'
      - 'demos/aie/REPORT.md'
      - 'demos/ldzip/REPORT.md'
      - 'demos/ldzip/NATIVE_REPORT.md'
      - 'demos/ldzip/REVIEW.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/peakwhere/package-lock.json
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.3'
      - run: npm ci
        working-directory: demos/peakwhere
      - run: npm run stage && npm run stage:peek && npm run vendor
        working-directory: demos/peakwhere
      - name: Render site
        run: scripts/render-site.sh _site
      - name: Check site
        run: node scripts/check-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
