name: test

on:
  push:
    branches: [main, develop]
    paths:
      - 'demos/peakwhere/**'
      - 'demos/aie/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'demos/peakwhere/**'
      - 'demos/aie/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peakwhere:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/peakwhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/peakwhere/package-lock.json
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: npm ci
      - run: npm run stage
      - run: npm run stage:dev
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run stage:peek
      - run: npm run vendor
      - run: npx playwright-core install --with-deps chromium
      - name: Oracle output is up to date
        run: |
          Rscript test/oracle.R
          git diff --exit-code demos/peakwhere/test/fixtures/thymus-expected.json
      - run: npm test

  aie:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/aie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            demos/aie/.gravlax/target
          key: aie-${{ runner.os }}-75b8d6c01064ba92af295543d50230429774e170
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y samtools jq unzip
      - run: ./setup.sh
      - run: ./test.sh
      - run: ./mutation_test.sh
