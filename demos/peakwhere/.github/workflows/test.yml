name: test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - run: npm ci

      # Extension downloads are hash-checked against the signed and dev manifests.
      - run: npm run stage
      - run: npm run stage:dev
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run stage:peek
      - run: npm run vendor

      - run: npx playwright-core install --with-deps chromium

      # The committed thymus expectations must be exactly what the independent
      # base-R oracle produces.
      - name: Oracle output is up to date
        run: |
          Rscript test/oracle.R
          git diff --exit-code test/fixtures/thymus-expected.json

      - run: npm test
